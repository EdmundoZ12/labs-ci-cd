name: Release Spring Boot Application

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:

      # 1. Obtener el código
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Configurar Java
      - name: Set up Java 20
        uses: actions/setup-java@v5
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      # 3. Permitir ejecutar Maven Wrapper
      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      # 4. Obtener versión desde pom.xml
      - name: Get project version
        id: project
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      # 5. Compilar, probar y empaquetar
      - name: Build application
        run: ./mvnw -B clean package

      # 6. Encontrar el JAR generado
      - name: Find application JAR
        id: jar
        run: |
          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR file was found."
            exit 1
          fi

          echo "path=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR_FILE")" >> "$GITHUB_OUTPUT"

          echo "JAR found: $JAR_FILE"

      # 7. Guardar también como GitHub Actions Artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: webapi-${{ steps.project.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      # 8. Crear GitHub Release y adjuntar el JAR
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.jar.outputs.path }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "Spring Boot Web API - Version ${{ steps.project.outputs.version }}"