name: CI - JUnit and Code Coverage

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================================================
  # JOB 1 - BUILD
  # =========================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 20
        uses: actions/setup-java@v5
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests --file pom.xml

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error


  # =========================================================
  # JOB 2 - UNIT TESTS
  # =========================================================
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 20
        uses: actions/setup-java@v5
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests with Maven
        run: ./mvnw -B test --file pom.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: warn


  # =========================================================
  # JOB 3 - CODE COVERAGE
  # =========================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 20
        uses: actions/setup-java@v5
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Code Coverage with Maven
        run: ./mvnw -B clean verify --file pom.xml

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn